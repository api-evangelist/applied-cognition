aid: applied-cognition
name: Applied Cognition
description: Applied Cognition is a clinical-stage neuroscience company unlocking the therapeutic
  power of the brain's glymphatic system, the waste-clearance mechanism implicated in
  neurodegeneration. The company pairs a first-in-human, non-invasive platform for continuous,
  real-time measurement of glymphatic function (validated against contrast-enhanced MRI)
  with a small-molecule drug pipeline targeting Alzheimer's disease, Parkinson's disease,
  and post-traumatic headache, supported by issued platform patents and datasets positioned
  for AI integration. Backed by Mayfield, it was surfaced as a portfolio-company lead and
  added to the API Evangelist network for enrichment. It is a therapeutics/medical company
  and does not currently publish a public developer program, API, or developer documentation.
